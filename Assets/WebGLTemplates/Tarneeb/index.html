<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#144a30">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #144a30; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #144a30; touch-action: none; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f5cb5c; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #144a30; z-index: 5; transition: opacity .3s; }
      #loading h1 { font-size: 12vmin; letter-spacing: .08em; margin: 0 0 4vmin; }
      #bar { width: 60vmin; height: 1.6vmin; background: rgba(255,255,255,.15); border-radius: 1vmin; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #f5cb5c; transition: width .15s; }
      #fs { position: fixed; right: 10px; bottom: 10px; z-index: 6; width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(0,0,0,.35); color: #fff; font-size: 22px; cursor: pointer; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><h1>TARNEEB</h1><div id="bar"><div id="fill"></div></div></div>
    <button id="fs" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.getElementById("fill");
      var loading = document.getElementById("loading");
      var fsButton = document.getElementById("fs");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) { fill.style.width = (progress * 100) + "%"; }).then(function (unityInstance) {
        loading.style.opacity = 0;
        setTimeout(function () { loading.style.display = "none"; }, 350);
        if (document.fullscreenEnabled) {
          fsButton.style.display = "block";
          fsButton.onclick = function () { unityInstance.SetFullscreen(1); };
        }
      }).catch(function (message) { alert(message); });
    </script>
  </body>
</html>
